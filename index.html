<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meu Portfólio</title>
<meta name="description" content="Portfólio de João Victor Chagas Medeiros — desenvolvedor web freelancer e operador de Help Desk."/>
<link rel="icon" type="image/png" sizes="512x512" href="https://res.cloudinary.com/dcvhqnr1c/image/upload/v1779109025/favicon_atailm.png"/>
<link rel="apple-touch-icon" href="https://res.cloudinary.com/dcvhqnr1c/image/upload/v1779109025/favicon_atailm.png"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #060d18;
    --bg2: #0b1a2e;
    --bg3: #0f2239;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --accent3: #34d399;
    --text: #e8f0fe;
    --muted: #7a92b0;
    --border: rgba(56,189,248,0.15);
    --border2: rgba(56,189,248,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow-x: hidden;
    cursor: default;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 18px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(6,13,24,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .nav-logo span { color: var(--accent2); }

  .nav-links {
    display: flex;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.08em;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--accent); }

  /* SECTIONS */
  section {
    min-height: 100vh;
    padding: 120px 48px 80px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* HERO */
  #hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    min-height: 100vh;
    padding-top: 80px;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 64px;
    align-items: center;
  }

  .hero-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.15em;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
  }

  .hero-name {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(22px, 2.8vw, 38px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    opacity: 0;
    white-space: nowrap;
    animation: fadeUp 0.6s 0.35s forwards;
  }

  .hero-name .accent { color: var(--accent); }

  .hero-role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--accent2);
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s forwards;
  }

  .hero-desc {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 500px;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.6s 0.65s forwards;
  }

  .hero-ctas {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s forwards;
  }

  .btn-primary {
    padding: 12px 28px;
    background: var(--accent);
    color: #060d18;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    letter-spacing: 0.05em;
    text-decoration: none;
    display: inline-block;
    transition: transform 0.2s, box-shadow 0.2s;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(56,189,248,0.35);
  }

  .btn-secondary {
    padding: 12px 28px;
    background: transparent;
    color: var(--accent);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border: 1px solid var(--border2);
    cursor: pointer;
    letter-spacing: 0.05em;
    text-decoration: none;
    display: inline-block;
    transition: all 0.2s;
  }

  .btn-secondary:hover {
    background: rgba(56,189,248,0.08);
    border-color: var(--accent);
  }

  /* Photo card */
  .hero-photo {
    opacity: 0;
    animation: fadeIn 0.8s 0.5s forwards;
  }

  .photo-frame {
    position: relative;
    width: 320px;
    height: 380px;
    margin: 0 auto;
  }

  .photo-placeholder {
    width: 100%;
    height: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
    position: relative;
    overflow: hidden;
  }

  .photo-placeholder::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(56,189,248,0.05) 0%, transparent 60%);
  }

  .photo-icon {
    width: 72px;
    height: 72px;
    border: 2px dashed var(--border2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--muted);
  }

  .photo-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-align: center;
  }

  .photo-corner {
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: var(--accent);
    border-style: solid;
  }

  .photo-corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .photo-corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .photo-badge {
    position: absolute;
    bottom: -16px;
    right: -16px;
    background: var(--bg2);
    border: 1px solid var(--border2);
    padding: 10px 16px;
  }

  .photo-badge-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.1em;
  }

  .photo-badge-num {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
  }

  /* SECTION TITLES */
  .section-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.2em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
    max-width: 80px;
  }

  .section-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(28px, 3.5vw, 48px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 48px;
    line-height: 1.1;
  }

  .section-title .accent { color: var(--accent); }

  /* SOBRE */
  #sobre {
    padding-top: 100px;
  }

  .sobre-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: start;
  }

  .sobre-text {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 16px;
  }

  .sobre-text strong { color: var(--text); font-weight: 600; }

  .skills-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 28px;
  }

  .skill-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .skill-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    flex-shrink: 0;
  }

  .stats-block {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .stat-card:hover { border-color: var(--border2); }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: var(--accent);
  }

  .stat-card:nth-child(2)::before { background: var(--accent2); }
  .stat-card:nth-child(3)::before { background: var(--accent3); }
  .stat-card:nth-child(4)::before { background: var(--accent); }

  .stat-num {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
  }

  .stat-label {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* EXPERIÊNCIA */
  #experiencia { padding-top: 100px; }

  .timeline {
    position: relative;
    padding-left: 32px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, var(--accent), transparent);
  }

  .timeline-item {
    position: relative;
    margin-bottom: 48px;
  }

  .timeline-dot {
    position: absolute;
    left: -38px;
    top: 6px;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 4px rgba(56,189,248,0.2);
  }

  .timeline-item.active .timeline-dot {
    animation: pulse 2s infinite;
  }

  .timeline-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 28px 32px;
    position: relative;
    transition: border-color 0.3s, transform 0.3s;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
  }

  .timeline-card:hover {
    border-color: var(--border2);
    transform: translateX(4px);
  }

  .timeline-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(to right, var(--accent), transparent);
  }

  .timeline-company {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.15em;
    margin-bottom: 6px;
  }

  .timeline-role {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .timeline-period {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .active-badge {
    background: rgba(52,211,153,0.15);
    border: 1px solid rgba(52,211,153,0.4);
    color: var(--accent3);
    font-size: 10px;
    padding: 2px 8px;
    letter-spacing: 0.1em;
    font-family: 'JetBrains Mono', monospace;
  }

  .timeline-desc {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 16px;
  }

  .timeline-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 12px;
    border: 1px solid var(--border2);
    color: var(--accent);
    letter-spacing: 0.08em;
  }

  /* FORMAÇÃO */
  #formacao { padding-top: 100px; }

  .cursos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .curso-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 28px 24px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .curso-card:hover {
    border-color: var(--border2);
    transform: translateY(-4px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.4);
  }

  .curso-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 2px;
  }

  .curso-card.grad::after { background: linear-gradient(to right, var(--accent), transparent); }
  .curso-card.cert::after { background: linear-gradient(to right, var(--accent2), transparent); }
  .curso-card.hdi::after { background: linear-gradient(to right, var(--accent3), transparent); }

  .curso-icon {
    width: 44px;
    height: 44px;
    background: rgba(56,189,248,0.1);
    border: 1px solid var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .curso-card.cert .curso-icon { background: rgba(129,140,248,0.1); border-color: rgba(129,140,248,0.3); }
  .curso-card.hdi .curso-icon { background: rgba(52,211,153,0.1); border-color: rgba(52,211,153,0.3); }

  .curso-type {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--accent);
  }

  .curso-card.cert .curso-type { color: var(--accent2); }
  .curso-card.hdi .curso-type { color: var(--accent3); }

  .curso-name {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
  }

  .curso-inst {
    font-size: 13px;
    color: var(--muted);
  }

  .curso-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .status-cursando { color: var(--accent3); }
  .status-concluido { color: var(--muted); }

  /* PROJETOS */
  #projetos { padding-top: 100px; }

  .projetos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .projeto-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
  }

  .projeto-card:hover {
    border-color: var(--border2);
    transform: translateY(-4px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.4);
  }

  .projeto-thumb {
    height: 160px;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .projeto-thumb::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(56,189,248,0.05) 0%, rgba(129,140,248,0.05) 100%);
  }

  .projeto-thumb-icon {
    font-size: 32px;
    opacity: 0.4;
  }

  .projeto-thumb-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .projeto-num {
    position: absolute;
    top: 12px;
    left: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: rgba(6,13,24,0.8);
    padding: 2px 8px;
    border: 1px solid var(--border2);
  }

  .projeto-content {
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .projeto-type {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent2);
    letter-spacing: 0.12em;
  }

  .projeto-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
  }

  .projeto-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    flex: 1;
  }

  .projeto-links {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .projeto-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.2s;
  }

  .projeto-link:hover { color: var(--accent); }

  .projeto-badge-admin {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 10px;
    background: rgba(52,211,153,0.1);
    border: 1px solid rgba(52,211,153,0.35);
    color: var(--accent3);
    letter-spacing: 0.05em;
    border-radius: 4px;
  }

  /* CONTATO */
  #contato {
    padding-top: 100px;
    padding-bottom: 80px;
  }

  .contato-inner {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 64px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .contato-inner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--accent), var(--accent2), transparent);
  }

  .contato-inner::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--accent2), var(--accent), transparent);
  }

  .contato-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }

  .contato-sub {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 40px;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }

  .contato-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .contato-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border: 1px solid var(--border2);
    color: var(--text);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    transition: all 0.2s;
  }

  .contato-link:hover {
    background: rgba(56,189,248,0.08);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* FOOTER */
  footer {
    padding: 24px 48px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto;
  }

  .footer-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(56,189,248,0.2); }
    50% { box-shadow: 0 0 0 8px rgba(56,189,248,0.05); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .cursor {
    display: inline-block;
    width: 3px;
    height: 0.85em;
    background: var(--accent);
    vertical-align: middle;
    animation: blink 1s infinite;
    margin-left: 2px;
  }

  /* BG Decoration */
  .bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }

  .bg-glow-1 {
    width: 600px;
    height: 600px;
    background: rgba(56,189,248,0.04);
    top: -200px;
    right: -200px;
  }

  .bg-glow-2 {
    width: 400px;
    height: 400px;
    background: rgba(129,140,248,0.04);
    bottom: 0;
    left: -100px;
  }

  .content-wrap { position: relative; z-index: 1; }

  /* SCROLL REVEAL */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.6s, transform 0.6s;
  }

  .reveal.visible {
    opacity: 1;
    transform: none;
  }

  /* Portfolio entry animation */
  .portfolio-enter {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #060d18;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.6s ease;
  }
  .portfolio-enter.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .pe-logo {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 32px;
    color: var(--accent);
    letter-spacing: 0.05em;
    animation: peSlideUp 0.6s 0.1s both;
  }
  .pe-logo span { color: var(--accent2); }
  .pe-tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.2em;
    animation: peSlideUp 0.5s 0.3s both;
  }
  .pe-bar {
    width: 180px;
    height: 2px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
    animation: peSlideUp 0.4s 0.4s both;
  }
  .pe-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, var(--accent), var(--accent2));
    border-radius: 2px;
    animation: peFill 0.7s 0.45s forwards ease;
  }
  @keyframes peSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes peFill { to { width: 100%; } }

  /* Transition overlay */
  .page-transition {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: #060d18;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .page-transition.active {
    opacity: 1;
    pointer-events: all;
  }
  .pt-logo {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.05em;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.4s 0.15s ease;
  }
  .pt-logo span { color: var(--accent2); }
  .page-transition.active .pt-logo {
    opacity: 1;
    transform: translateY(0);
  }
  .pt-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.15em;
    opacity: 0;
    transition: opacity 0.4s 0.3s ease;
  }
  .page-transition.active .pt-text { opacity: 1; }
  .pt-bar {
    width: 200px;
    height: 2px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s 0.3s ease;
  }
  .page-transition.active .pt-bar { opacity: 1; }
  .pt-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.6s 0.4s ease;
  }
  .page-transition.active .pt-bar-fill { width: 100%; }

  .nav-menu-btn {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
    background: none;
    border: none;
  }
  .nav-menu-btn span {
    display: block;
    width: 26px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    transition: all 0.3s;
  }
  .nav-mobile {
    display: none;
    position: fixed;
    top: 56px; left: 0; right: 0;
    background: rgba(6,13,24,0.97);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    flex-direction: column;
    gap: 4px;
    z-index: 99;
  }
  .nav-mobile.open { display: flex; }
  .nav-mobile a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    text-decoration: none;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    transition: color 0.2s;
  }
  .nav-mobile a:last-child { border-bottom: none; }
  .nav-mobile a:hover { color: var(--accent); }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    nav { padding: 14px 20px; }
    .nav-links { display: none; }
    .nav-menu-btn { display: flex !important; }

    section { padding: 80px 16px 56px; min-height: auto; }
    #hero { min-height: 100svh; padding-top: 64px; }

    /* Hero */
    .hero-grid { grid-template-columns: 1fr; gap: 28px; }
    .hero-photo { order: -1; display: flex; justify-content: center; }
    .photo-frame { width: 180px; height: 220px; }
    .photo-badge { bottom: -10px; right: -6px; padding: 7px 10px; }
    .photo-badge-num { font-size: 16px; }
    .photo-badge-text { font-size: 8px; }
    .hero-tag { font-size: 10px; margin-bottom: 10px; }
    .hero-role { font-size: 13px; margin-bottom: 16px; }
    .hero-desc { font-size: 14px; line-height: 1.65; margin-bottom: 28px; }
    .hero-ctas { flex-direction: column; gap: 10px; }
    .btn-primary, .btn-secondary { text-align: center; padding: 13px 20px; font-size: 13px; width: 100%; }

    /* Section titles */
    .section-eyebrow { font-size: 10px; }
    .section-title { font-size: 26px; margin-bottom: 28px; }

    /* Sobre */
    #sobre { padding-top: 80px; }
    .sobre-grid { grid-template-columns: 1fr; gap: 28px; }
    .sobre-text { font-size: 14px; line-height: 1.7; }
    .skills-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .skill-item { font-size: 11px; }
    .stats-block { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card { padding: 16px; }
    .stat-num { font-size: 26px; }
    .stat-label { font-size: 12px; }

    /* Experiência */
    #experiencia { padding-top: 80px; }
    .timeline { padding-left: 20px; }
    .timeline-dot { left: -26px; width: 10px; height: 10px; }
    .timeline-card { padding: 18px 16px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
    .timeline-company { font-size: 10px; }
    .timeline-role { font-size: 16px; }
    .timeline-period { font-size: 11px; flex-wrap: wrap; gap: 6px; }
    .timeline-desc { font-size: 13px; line-height: 1.65; }
    .timeline-tags { gap: 5px; flex-wrap: wrap; }
    .tag { font-size: 10px; padding: 3px 8px; }
    .active-badge { font-size: 9px; padding: 2px 6px; }

    /* Formação */
    #formacao { padding-top: 80px; }
    .cursos-grid { grid-template-columns: 1fr; gap: 12px; }
    .curso-card { padding: 18px; gap: 8px; }
    .curso-icon { width: 38px; height: 38px; font-size: 16px; }
    .curso-name { font-size: 15px; }
    .curso-inst { font-size: 12px; }
    .curso-status { font-size: 11px; }

    /* Projetos */
    #projetos { padding-top: 80px; }
    .projetos-grid { grid-template-columns: 1fr; gap: 14px; }
    .projeto-thumb { height: 160px; }
    .projeto-content { padding: 16px; gap: 6px; }
    .projeto-type { font-size: 9px; }
    .projeto-title { font-size: 15px; }
    .projeto-desc { font-size: 12px; }
    .projeto-links { gap: 10px; padding-top: 10px; margin-top: 8px; }
    .projeto-link { font-size: 11px; }
    .projeto-badge-admin { font-size: 10px; padding: 2px 8px; }

    /* Contato */
    #contato { padding-top: 80px; }
    .contato-inner { padding: 30px 16px; }
    .contato-title { font-size: 26px; }
    .contato-sub { font-size: 13px; margin-bottom: 24px; }
    .contato-links { flex-direction: column; align-items: stretch; gap: 10px; }
    .contato-link { width: 100%; justify-content: center; font-size: 12px; padding: 12px 14px; }

    footer { padding: 18px 16px; flex-direction: column; gap: 6px; text-align: center; }
    .footer-text { font-size: 11px; }
  }

  @media (max-width: 400px) {
    section { padding: 76px 14px 48px; }
    .hero-name { font-size: 20px; white-space: normal; }
    .stats-block { grid-template-columns: 1fr 1fr; }
    .skills-grid { grid-template-columns: 1fr; }
    .photo-frame { width: 160px; height: 195px; }
    .section-title { font-size: 22px; }
    .timeline-card { padding: 14px 12px; }
    .sobre-text { font-size: 13px; }
  }

  /* ================= v2 — cores por item na linha do tempo ================= */
  .timeline-item { --c: var(--accent); }
  .timeline-item[data-c="purple"] { --c: var(--accent2); }
  .timeline-item[data-c="green"]  { --c: var(--accent3); }
  .timeline-item[data-c="amber"]  { --c: #fbbf24; }
  .timeline-item[data-c="rose"]   { --c: #fb7185; }
  .timeline-item .timeline-dot { background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent); }
  .timeline-item .timeline-card { border-color: color-mix(in srgb, var(--c) 22%, transparent); }
  .timeline-item .timeline-company { color: var(--c); }
  .timeline-item .timeline-tags .tag { color: var(--c); border-color: color-mix(in srgb, var(--c) 32%, transparent); }
  .timeline-item:not([data-c="blue"]) .active-badge {
    color: var(--c);
    border-color: color-mix(in srgb, var(--c) 40%, transparent);
    background: color-mix(in srgb, var(--c) 12%, transparent);
  }

  /* ================= v2 — carrossel (cursos e projetos) ================= */
  .cx { position: relative; max-width: 1040px; margin: 0 auto; outline: none; }
  .cx:focus-visible { outline: 1px dashed var(--border2); outline-offset: 10px; }
  .cx-empty { color: var(--muted); font-size: 14px; }

  .cx-stage {
    display: grid;
    overflow: hidden;
    padding: 14px 0 26px;
    perspective: 1400px;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }

  .cx-card {
    --c: var(--accent);
    grid-area: 1 / 1;
    justify-self: center;
    position: relative;
    width: min(560px, 84%);
    display: flex;
    flex-direction: column;
    background: var(--bg2);
    border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
    transition: transform .85s cubic-bezier(.22, 1, .36, 1), opacity .6s ease, filter .6s ease;
    will-change: transform, opacity;
  }
  .cx-card[data-c="purple"] { --c: var(--accent2); }
  .cx-card[data-c="green"]  { --c: var(--accent3); }
  .cx-card[data-c="amber"]  { --c: #fbbf24; }
  .cx-card[data-c="rose"]   { --c: #fb7185; }
  .cx-card:not(.is-active) { filter: brightness(.55) saturate(.75); }
  .cx-card::before {
    content: '';
    position: absolute; left: 0; right: 0; top: 0; height: 3px; z-index: 3;
    background: linear-gradient(90deg, var(--c), transparent);
  }

  .cx-media {
    position: relative;
    aspect-ratio: 16 / 9;
    background: var(--mbg, var(--bg3));
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .cx-media::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 38%; z-index: 2;
    background: linear-gradient(transparent, var(--bg2)); pointer-events: none;
  }
  .cx-media.is-contain::after { display: none; }
  .cx-media img, .cx-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .cx-media.is-contain img, .cx-media.is-contain video { inset: 13% 14%; width: 72%; height: 74%; object-fit: contain; object-position: center; z-index: 1; }
  .cx-emoji { font-size: 58px; opacity: .9; position: relative; z-index: 1; }

  .cx-body { padding: 14px 24px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .cx-type { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .14em; color: var(--c); }
  .cx-title { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
  .cx-sub { font-size: 13px; color: var(--muted); margin-top: -4px; }
  .cx-desc { font-size: 13.5px; color: #94a8c0; line-height: 1.7; }
  .cx-flags { display: flex; flex-wrap: wrap; gap: 6px; }
  .cx-flags .tag { font-size: 10px; padding: 2px 8px; color: var(--c); border-color: color-mix(in srgb, var(--c) 35%, transparent); }
  .cx-status { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--c); }
  .cx-links {
    margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .cx-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    padding: 7px 12px; border: 1px solid var(--border2); color: var(--text); text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .2s, border-color .2s, color .2s;
  }
  .cx-btn:hover { border-color: var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .cx-btn.main { background: color-mix(in srgb, var(--c) 14%, transparent); border-color: color-mix(in srgb, var(--c) 45%, transparent); color: var(--c); }

  .cx-nav {
    position: absolute; top: calc(50% - 34px); z-index: 30;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(6, 13, 24, .82); border: 1px solid var(--border2); color: var(--accent);
    font-size: 24px; line-height: 1; cursor: pointer; display: grid; place-items: center;
    transition: transform .25s ease, background .25s ease, border-color .25s ease;
  }
  .cx-nav:hover { background: rgba(56, 189, 248, .14); border-color: var(--accent); transform: scale(1.08); }
  .cx-nav.prev { left: 0; }
  .cx-nav.next { right: 0; }

  .cx-dots { display: flex; justify-content: center; gap: 8px; }
  .cx-dot {
    width: 10px; height: 10px; border-radius: 99px; padding: 0; cursor: pointer;
    background: var(--bg3); border: 1px solid var(--border2);
    position: relative; overflow: hidden; transition: width .45s cubic-bezier(.22, 1, .36, 1);
  }
  .cx-dot i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .cx-dot.on { width: 46px; }
  .cx-dot.on i { animation: cxFill var(--dwell, 5.6s) linear forwards; }
  .cx.paused .cx-dot.on i { animation-play-state: paused; }
  @keyframes cxFill { to { transform: scaleX(1); } }

  @media (max-width: 700px) {
    .cx-card { width: 86%; }
    .cx-nav { display: none; }
    .cx-body { padding: 12px 16px 18px; }
    .cx-title { font-size: 18px; }
    .cx-desc { font-size: 13px; }
    .cx-stage { padding-bottom: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cx-card { transition: none; }
    .cx-dot.on i { animation: none; transform: scaleX(1); }
  }

  /* ================= v2 — atualização ao vivo: sem repetir as animações de entrada ================= */
  body.is-live .hero-tag, body.is-live .hero-name, body.is-live .hero-role,
  body.is-live .hero-desc, body.is-live .hero-ctas, body.is-live .hero-photo { animation: none; opacity: 1; }

  /* ================= v2 — galeria de imagens/vídeos dentro do card ================= */
  .cx-slides { position: absolute; inset: 0; z-index: 1; }
  .cx-slide { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease; }
  .cx-slide.on { opacity: 1; }
  .cx-m-nav {
    position: absolute; top: calc(50% - 17px); z-index: 4; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(6, 13, 24, .6); border: 1px solid var(--border2); color: var(--text); font-size: 20px; line-height: 1;
    cursor: pointer; display: grid; place-items: center; opacity: .55;
    transition: opacity .25s, background .25s, transform .25s;
  }
  .cx-m-nav.prev { left: 10px; }
  .cx-m-nav.next { right: 10px; }
  .cx-card:hover .cx-m-nav, .cx-m-nav:focus-visible { opacity: 1; }
  .cx-m-nav:hover { background: rgba(56, 189, 248, .25); transform: scale(1.08); }
  .cx-m-dots { position: absolute; left: 0; right: 0; bottom: 10px; z-index: 4; display: flex; justify-content: center; gap: 6px; }
  .cx-m-dot {
    width: 7px; height: 7px; padding: 0; border-radius: 99px; cursor: pointer; border: 0;
    background: rgba(232, 240, 254, .4); transition: width .35s cubic-bezier(.22, 1, .36, 1), background .3s;
  }
  .cx-m-dot.on { width: 20px; background: var(--c); }
  @media (prefers-reduced-motion: reduce) { .cx-slide { transition: none; } }
</style>
</head>
<body>

<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<!-- Portfolio entry animation -->
<div class="portfolio-enter" id="portfolioEnter">
  <div class="pe-logo">JV<span>.</span>DEV</div>
  <div class="pe-tagline">// CARREGANDO PORTFÓLIO</div>
  <div class="pe-bar"><div class="pe-bar-fill"></div></div>
</div>

<!-- Transition overlay -->
<div class="page-transition" id="pageTransition">
  <div class="pt-logo">JV<span>.</span>DEV</div>
  <div class="pt-text">REDIRECIONANDO PARA SERVIÇOS...</div>
  <div class="pt-bar"><div class="pt-bar-fill" id="ptBarFill"></div></div>
</div>

<!-- NAV -->
<nav>
  <div class="nav-logo">JV<span>.</span>DEV</div>
  <ul class="nav-links">
    <li><a href="#sobre">// sobre</a></li>
    <li><a href="#experiencia">// experiência</a></li>
    <li><a href="#formacao">// formação</a></li>
    <li><a href="#projetos">// projetos</a></li>
    <li><a href="servicos.html" style="color: var(--accent); border: 1px solid rgba(56,189,248,0.3); padding: 4px 12px; border-radius: 4px;">// serviços</a></li>
    <li><a href="#contato">// contato</a></li>
  </ul>
  <button class="nav-menu-btn" id="menuBtn" aria-label="Abrir menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="nav-mobile" id="navMobile">
  <a href="#sobre">// sobre</a>
  <a href="#experiencia">// experiência</a>
  <a href="#formacao">// formação</a>
  <a href="#projetos">// projetos</a>
  <a href="servicos.html" style="color: var(--accent);">// serviços</a>
  <a href="#contato">// contato</a>
</div>

<div class="content-wrap">
<section id="hero"></section>
<section id="sobre"></section>
<section id="experiencia"></section>
<section id="formacao"></section>
<section id="projetos"></section>
<section id="contato"></section>
<footer id="rodape"></footer>
</div>

<script type="module">
import { DEFAULT_HOME } from './content-default.js';
import { renderHome } from './render.js';
import { bootPage } from './site.js';

/* ---------- animação de entrada: some quando o conteúdo estiver na tela ---------- */
const t0 = performance.now();
const enter = document.getElementById('portfolioEnter');
let entryHidden = false;
function hideEntry() {
  if (entryHidden || !enter) return;
  entryHidden = true;
  const wait = Math.max(0, 1100 - (performance.now() - t0));
  setTimeout(() => {
    enter.classList.add('fade-out');
    setTimeout(() => enter.remove(), 650);
  }, wait);
}
setTimeout(hideEntry, 6000); // segurança: nunca deixa a tela travada

/* ---------- conteúdo ---------- */
let jumped = false;
function draw(data, opts) {
  renderHome(data, opts);
  if (!jumped && location.hash.length > 1) {
    jumped = true;
    requestAnimationFrame(() => document.querySelector(location.hash)?.scrollIntoView({ behavior: 'instant', block: 'start' }));
  }
  hideEntry();
}
bootPage({ id: 'home', defaults: DEFAULT_HOME, render: draw }).catch((e) => {
  console.error(e);
  draw(DEFAULT_HOME);
});

/* ---------- menu mobile ---------- */
const menuBtn = document.getElementById('menuBtn');
const navMobile = document.getElementById('navMobile');
const bars = () => menuBtn.querySelectorAll('span');
function closeMenu() {
  navMobile.classList.remove('open');
  bars().forEach((s) => {
    s.style.transform = '';
    s.style.opacity = '';
  });
}
menuBtn.addEventListener('click', () => {
  const open = navMobile.classList.toggle('open');
  const [a, b, c] = bars();
  if (open) {
    a.style.transform = 'rotate(45deg) translate(5px, 5px)';
    b.style.opacity = '0';
    c.style.transform = 'rotate(-45deg) translate(5px, -5px)';
  } else closeMenu();
});
navMobile.addEventListener('click', (e) => {
  if (e.target.closest('a')) closeMenu();
});

/* ---------- transição para a página de serviços ---------- */
const overlay = document.getElementById('pageTransition');
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href="servicos.html"]');
  if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  overlay.classList.add('active');
  setTimeout(() => (window.location.href = 'servicos.html'), 1000);
});
// voltando com o botão "Voltar" do navegador, a tela de transição não pode ficar aberta
addEventListener('pageshow', () => overlay.classList.remove('active'));
</script>
</body>
</html>
